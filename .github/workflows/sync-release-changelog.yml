name: Sync release changelog

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: sync-release-changelog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync release changelog
        run: npm run sync:changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit synchronized changelog
        run: |
          if git diff --quiet -- docs/changelog.json; then
            echo "Release changelog is unchanged"
            exit 0
          fi

          git config user.name "ct-yx"
          git config user.email "122712983+ct-yx@users.noreply.github.com"
          git add docs/changelog.json
          git commit -m "docs: sync release changelog"
          git push origin HEAD:main
